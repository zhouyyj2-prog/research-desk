<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="研究台"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>研究台</title>
<style>
/* Layout: lab console. Sticky bar with plan progress + tabs. Library = Zotero-style three panes (collections | items | item pane); reader = full-screen PDF with translation rail. */
:root{
  --bg:#f3f5f8; --panel:#ffffff; --ink:#18202c; --muted:#5b6678; --line:#dde2ea; --soft:#eaeef4; --sel:#dfe7fb;
  --accent:#2b54c9; --accent-soft:#e3eafb;
  --d-protect:#0f7b6c; --d-wm:#7a4bc2; --d-transfer:#c25a12; --d-detect:#b8325a; --d-adv:#5b7a12; --d-gen:#1f6fa8; --d-crypt:#8a6232; --d-other:#5b6678;
  --ok:#1d7f46; --ok-soft:#e1f3e8; --warn:#9a6a00; --warn-soft:#fbf0d6; --bad:#a33b3b; --bad-soft:#f8e3e3; --done:#2b54c9;
  --paper:#ffffff; --reader-bg:#d9dee6;
  --f-display:"Noto Serif SC","Songti SC",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141b; --panel:#171c25; --ink:#e4e8ef; --muted:#9aa5b6; --line:#2a313d; --soft:#1f2531; --sel:#24314f;
  --accent:#7fa0ff; --accent-soft:#1f2a47;
  --d-protect:#3fc2ae; --d-wm:#b392ef; --d-transfer:#f0954e; --d-detect:#f07a9c; --d-adv:#a8cf62; --d-gen:#6fb6ea; --d-crypt:#d0a874; --d-other:#9aa5b6;
  --ok:#5ccf8a; --ok-soft:#173326; --warn:#e3b54a; --warn-soft:#33290f; --bad:#f08a8a; --bad-soft:#3a1d1d; --done:#7fa0ff;
  --paper:#f4f4f2; --reader-bg:#0c0f14;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141b; --panel:#171c25; --ink:#e4e8ef; --muted:#9aa5b6; --line:#2a313d; --soft:#1f2531; --sel:#24314f;
  --accent:#7fa0ff; --accent-soft:#1f2a47;
  --d-protect:#3fc2ae; --d-wm:#b392ef; --d-transfer:#f0954e; --d-detect:#f07a9c; --d-adv:#a8cf62; --d-gen:#6fb6ea; --d-crypt:#d0a874; --d-other:#9aa5b6;
  --ok:#5ccf8a; --ok-soft:#173326; --warn:#e3b54a; --warn-soft:#33290f; --bad:#f08a8a; --bad-soft:#3a1d1d; --done:#7fa0ff;
  --paper:#f4f4f2; --reader-bg:#0c0f14;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.86em}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 12px;font-size:.85rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:2px 8px;font-size:.78rem}
.btn.readbtn.done{background:color-mix(in srgb,var(--ok) 18%,var(--panel));border-color:var(--ok);color:var(--ink)}
.chip.readchip{border-color:var(--ok);color:var(--ink);background:color-mix(in srgb,var(--ok) 14%,transparent)}
input.field,select.field,textarea.field{width:100%;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--ink);padding:3px 6px;font:inherit;font-size:.88rem}
input.field:hover,select.field:hover,textarea.field:hover{border-color:var(--line)}
input.field:focus,select.field:focus,textarea.field:focus{border-color:var(--accent);background:var(--bg);outline:none}
textarea.field{resize:vertical;min-height:2.2em}
.box{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);padding:6px 10px;font:inherit;font-size:.88rem}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
.topin{display:flex;flex-wrap:wrap;align-items:center;gap:10px 24px;padding-block:10px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand h1{font-family:var(--f-display);font-size:1.2rem;margin:0;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:.78rem}
.plan{flex:1 1 360px;min-width:0}
.planhead{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--muted);flex-wrap:wrap}
.planhead b{color:var(--ink);font-weight:600}
.track{display:grid;grid-template-columns:repeat(28,1fr) 3fr;gap:2px;margin-top:5px}
.track i{height:7px;border-radius:2px;background:var(--soft)}
.track i.p1{background:color-mix(in srgb,var(--d-protect) 35%,var(--soft))}
.track i.p2{background:color-mix(in srgb,var(--accent) 35%,var(--soft))}
.track i.p3{background:color-mix(in srgb,var(--d-transfer) 35%,var(--soft))}
.track i.p4{background:color-mix(in srgb,var(--d-wm) 35%,var(--soft))}
.track i.past{filter:saturate(1.6) brightness(.85)}
.track i.today{outline:2px solid var(--ink);outline-offset:1px}
nav.tabs{display:flex;gap:4px;border-top:1px solid var(--line);overflow-x:auto}
nav.tabs button{background:none;border:0;padding:9px 14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
nav.tabs .count{font-family:var(--f-mono);font-size:.75rem;margin-left:6px;color:var(--muted)}
main{padding-block:16px 48px}
[hidden]{display:none!important}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:.9rem;display:flex;justify-content:space-between;gap:12px}
.notice button{background:none;border:0;color:inherit;text-decoration:underline}
.empty{border:1px dashed var(--line);border-radius:10px;padding:24px;text-align:center;color:var(--muted)}
.lib.tujie2{grid-template-columns:230px minmax(0,1fr)}
.lib.tujie2>.col{padding:14px 16px;min-width:0}
@media (max-width:720px){.lib.tujie2{grid-template-columns:minmax(0,1fr)}}
.tujieframe{width:100%;height:calc(100vh - 260px);min-height:420px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.small{font-size:.84rem;color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:0 0 6px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.dir{color:var(--c);border-color:color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 9%,transparent)}
.chip.dir::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.chip.star{color:var(--accent);border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.chip.infer{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.chip.stated{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.chip.tag{color:var(--ink);background:var(--soft);border-color:var(--soft)}
.chip .x{border:0;background:none;padding:0 0 0 2px;color:var(--muted);line-height:1}

/* ---------- library (three panes) ---------- */
.lib{display:grid;grid-template-columns:230px minmax(0,1fr) 360px;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:72vh;overflow:hidden}
@media (max-width:1100px){.lib{grid-template-columns:200px minmax(0,1fr)} .lib .pane{grid-column:1 / -1;border-left:0;border-top:1px solid var(--line)}}
@media (max-width:720px){.lib{grid-template-columns:minmax(0,1fr)} .lib .side{border-right:0;border-bottom:1px solid var(--line);max-height:none}}
.side{border-right:1px solid var(--line);padding:12px 8px;display:flex;flex-direction:column;gap:14px;background:color-mix(in srgb,var(--soft) 45%,var(--panel));min-width:0;overflow-y:auto;max-height:80vh}
.side h4{font-size:.72rem;letter-spacing:.1em;color:var(--muted);margin:0 6px 4px;font-weight:500;display:flex;justify-content:space-between;align-items:center}
.side h4 button{border:0;background:none;color:var(--accent);font-size:.8rem;padding:0}
.tree{display:flex;flex-direction:column;gap:1px}
.node{display:flex;align-items:center;gap:8px;border:0;background:none;text-align:left;padding:4px 8px;border-radius:6px;font-size:.88rem;width:100%;min-width:0}
.node:hover{background:var(--soft)}
.node[aria-current="true"]{background:var(--sel);font-weight:600}
.node .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .n{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.node .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex-shrink:0}
.node .ic{width:14px;text-align:center;color:var(--muted);flex-shrink:0;font-size:.8rem}
.colrow{display:flex;align-items:center;gap:2px}
.colrow .node{flex:1}
.colrow .mini{border:0;background:none;color:var(--muted);font-size:.74rem;padding:2px 4px;border-radius:4px;visibility:hidden}
.colrow:hover .mini,.colrow:focus-within .mini{visibility:visible}
.tagcloud{display:flex;flex-wrap:wrap;gap:4px;padding:0 6px}
.tagcloud button{border:1px solid var(--line);background:var(--panel);border-radius:999px;font-size:.74rem;padding:0 8px}
.tagcloud button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.inline-new{display:flex;gap:4px;padding:0 6px}
.inline-new input{flex:1;min-width:0}

.items{display:flex;flex-direction:column;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}
.toolbar .search{flex:1 1 220px;min-width:0}
.toolbar select{width:auto}
.listwrap{overflow:auto;flex:1;max-height:72vh;position:relative}
.listwrap.drag{outline:2px dashed var(--accent);outline-offset:-6px;background:var(--accent-soft)}
table.list{border-collapse:collapse;width:100%;min-width:640px;font-size:.86rem}
table.list th{position:sticky;top:0;background:var(--panel);text-align:left;font-weight:500;font-size:.76rem;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.list th button{border:0;background:none;padding:0;color:inherit;font:inherit}
table.list td{padding:6px 10px;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);vertical-align:top}
table.list tr.row{cursor:default}
table.list tr.row:hover td{background:var(--soft)}
table.list tr.row[aria-selected="true"] td{background:var(--sel)}
td.t{min-width:260px} td.t .tt{font-weight:500;line-height:1.4}
td.d{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
td.au{color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdfmark{display:inline-block;font-family:var(--f-mono);font-size:.66rem;font-weight:600;padding:0 4px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.pdfmark.on{background:var(--bad);border-color:var(--bad);color:#fff}
.listfoot{padding:8px 12px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.droptip{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--accent);pointer-events:none}

.pane{border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.panetabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto}
.panetabs button{border:0;background:none;padding:9px 12px;font-size:.84rem;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.panetabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.panebody{padding:12px 14px;overflow-y:auto;max-height:72vh;display:flex;flex-direction:column;gap:12px;min-width:0}
.panehead{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.info{display:grid;grid-template-columns:5.2em minmax(0,1fr);gap:4px 8px;align-items:start}
.info label{font-size:.78rem;color:var(--muted);padding-top:5px;text-align:right}
.excerpt{border-left:3px solid var(--accent);padding:4px 10px;background:var(--soft);border-radius:0 6px 6px 0;font-size:.86rem}
.excerpt q{display:block;quotes:none}
.excerpt .tr{color:var(--muted);margin-top:4px}
.excerpt .meta{display:flex;justify-content:space-between;font-size:.74rem;color:var(--muted);margin-top:4px}
.attach{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.drop{border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center;color:var(--muted);font-size:.86rem}
.drop.drag{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.82rem;color:var(--bad)}
.colcheck{display:flex;flex-direction:column;gap:4px}
.colcheck label{display:flex;gap:8px;align-items:center;font-size:.88rem}

.addform{border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px;margin:10px 12px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.addform .full{grid-column:1 / -1}
.addform label{display:flex;flex-direction:column;gap:2px;font-size:.78rem;color:var(--muted)}
.addform .acts{grid-column:1 / -1;display:flex;gap:8px;justify-content:flex-end}

/* ---------- reader ---------- */
.reader{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;grid-template-rows:auto minmax(0,1fr)}
.rbar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line)}
.rbar .rt{flex:1 1 240px;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbar .grp{display:flex;gap:4px;align-items:center}
.rbar input.pg{width:3.4em;text-align:center}
.rbody{display:grid;grid-template-columns:minmax(0,1fr) 8px var(--rw,480px);min-height:0}
.rsplit{cursor:col-resize;background:var(--line);position:relative;touch-action:none}
.rsplit::after{content:"";position:absolute;left:2px;top:50%;width:4px;height:40px;margin-top:-20px;border-radius:2px;background:var(--muted);opacity:.5}
.rsplit:hover,.rsplit.drag{background:var(--accent-soft)}
.rside{font-size:1.02rem}
@media (max-width:860px){.rbody{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 45%}.rsplit{display:none}}
.pages{overflow:auto;background:var(--reader-bg);padding:16px;display:flex;flex-direction:column;align-items:safe center;gap:14px;min-height:0}
.pg-wrap{position:relative;background:var(--paper);box-shadow:0 1px 4px rgba(0,0,0,.25);flex-shrink:0;max-width:none}
.pg-wrap canvas{display:block}
.pg-wrap .pno{position:absolute;right:-2px;bottom:-18px;font-size:.7rem;color:var(--muted);font-family:var(--f-mono)}
.textLayer{position:absolute;inset:0;overflow:hidden;line-height:1;opacity:1;z-index:0;text-size-adjust:none;forced-color-adjust:none}
.textLayer span,.textLayer br{color:transparent;position:absolute;white-space:pre;cursor:text;transform-origin:0% 0%}
.textLayer ::selection{background:transparent}
.textLayer br::selection{background:transparent}
.selLayer{position:absolute;inset:0;pointer-events:none}
.selLayer div{position:absolute;background:rgba(43,84,201,.3);border-radius:2px}
.textLayer br::selection{background:transparent}
.textLayer span,.textLayer br{z-index:1}
.textLayer .endOfContent{display:block;position:absolute;inset:100% 0 0;z-index:0;cursor:default;user-select:none}
.textLayer.selecting .endOfContent{top:0}
.rside{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
@media (max-width:860px){.rside{border-left:0;border-top:1px solid var(--line)}}
.hlLayer{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply}
.hlLayer .hlg{position:absolute;inset:0;opacity:.5}
.hlLayer .hl{position:absolute;border-radius:2px}
.hlLayer .hl.hasnote{box-shadow:inset 0 -2px 0 rgba(0,0,0,.4)}
.rtoast{position:fixed;z-index:80;left:50%;bottom:24px;transform:translateX(-50%);max-width:min(560px,calc(100vw - 32px));background:var(--panel);color:var(--ink,inherit);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.2);padding:10px 14px;display:flex;gap:14px;align-items:flex-start;white-space:pre-wrap;font-size:.9rem}
.qa{display:flex;flex-direction:column;gap:10px}
.qalog{display:flex;flex-direction:column;gap:10px;max-height:55vh;overflow:auto;padding-right:2px}
.qa-q{align-self:flex-end;background:var(--accent-soft);border-radius:10px 10px 2px 10px;padding:8px 12px;max-width:90%;white-space:pre-wrap}
.qa-a{background:var(--soft);border-radius:10px 10px 10px 2px;padding:8px 12px;line-height:1.7}
.qa-a .md>*:first-child{margin-top:0}.qa-a .md>*:last-child{margin-bottom:0}
.qa-sel{background:var(--soft);padding:6px 10px;border-radius:8px;color:var(--muted)}
.rellist{display:flex;flex-direction:column;gap:8px}
.relcard{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.relcard .rt2{font-weight:600;line-height:1.45;margin-bottom:2px}
.relcard .rowbtns{gap:14px}
.pghead{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin:4px 0 14px}
.pgnav{display:flex;gap:8px;align-items:center}.pgnav b{min-width:8em;text-align:center}
.pgtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.pgtile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.pgnum{font-size:1.5rem;font-weight:650;margin-top:2px;font-variant-numeric:tabular-nums}
.pgcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.pgcard h3{font-size:.95rem;margin:0 0 10px}
.pgline{margin:0 0 8px;line-height:1.7}.pgsum{margin-top:10px}
.pgchart{position:relative}.pgaxis{position:absolute;top:-4px;left:0}
.pgplot{display:flex;align-items:flex-end;height:160px;border-bottom:1px solid var(--line);margin-top:22px}
.pgcol{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;padding:0 2px}
.pgcol i{display:block;width:100%;max-width:28px;background:var(--accent);border-radius:4px 4px 0 0}
.pgcol:hover i{opacity:.8}
.pgx{display:flex;font-size:.72rem;color:var(--muted);margin-top:4px}.pgx span{text-align:center;overflow:hidden;white-space:nowrap}
.pgtip{position:absolute;top:0;transform:translateX(-50%);background:var(--ink,#222);color:var(--panel);font-size:.78rem;padding:4px 8px;border-radius:6px;white-space:nowrap;pointer-events:none}
.pgdirs{display:flex;flex-direction:column;gap:8px}
.pgdir{display:grid;grid-template-columns:6.5em 1fr 5.5em;gap:10px;align-items:center}
.pgdbar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}.pgdbar i{display:block;height:100%;border-radius:5px}
.pgrow{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line)}.pgrow:last-child{border-bottom:0}
.pgrow>a,.pgrow>span:not(.small){flex:1;min-width:0}.pgrow .small{flex-shrink:0}
.pgrow .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;align-self:center}
.heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;overflow-x:auto;padding-bottom:4px}

<script>
const IS_MAC=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
if(!IS_MAC)document.addEventListener("DOMContentLoaded",()=>{for(const k of document.querySelectorAll("kbd"))if(k.textContent==="⌘K")k.textContent="Ctrl K"});
/* ---------- 本地后端适配层：替代 claude.ai 的 db / assets / sample / downloads ---------- */
(function(){
async function post(u,b){const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw{code:"http_"+r.status,message:j.error||("HTTP "+r.status)};return j}
async function get(u){const r=await fetch(u);const j=await r.json();if(!r.ok)throw{code:"http_"+r.status,message:j.error};return j}
const L={};const timers={};
function snap(docs,order){let d=docs.slice();if(order){const [f,dir]=order;d.sort((a,b)=>{const x=a[f]||"",y=b[f]||"";return (x<y?-1:x>y?1:0)*(dir==="desc"?-1:1)})}
  return{docs:d.map(x=>{const o=Object.assign({},x);const id=o.id;delete o.id;return{id,exists:true,data:()=>o,metadata:{}}}),size:d.length,empty:!d.length,docChanges:()=>[]}}
async function refresh(col){const docs=await get("/api/list?c="+encodeURIComponent(col));for(const l of (L[col]||[]))l.cb(snap(docs,l.order))}
function later(col){clearTimeout(timers[col]);timers[col]=setTimeout(()=>refresh(col).catch(()=>{}),120)}
window.__refreshAll=()=>Object.keys(L).forEach(c=>refresh(c).catch(()=>{}));
function coll(col,order){return{
  onSnapshot(cb,err){const l={cb,order};(L[col]=L[col]||[]).push(l);refresh(col).catch(e=>err&&err(e));return()=>{L[col]=(L[col]||[]).filter(x=>x!==l)}},
  orderBy(f,dir){return coll(col,[f,dir||"asc"])},where(){return this},limit(){return this},
  get(){return get("/api/list?c="+encodeURIComponent(col)).then(d=>snap(d,order))},
  doc(id){return docRef(col,id||("d"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)))},
  async add(data){const id="d"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await post("/api/set",{c:col,id,data});later(col);return docRef(col,id)}}}
function docRef(col,id){return{id,path:col+"/"+id,
  get:()=>get("/api/get?c="+encodeURIComponent(col)+"&id="+encodeURIComponent(id)).then(r=>({id,exists:r.exists,data:()=>r.data||undefined,metadata:{}})),
  set:data=>post("/api/set",{c:col,id,data}).then(()=>{later(col)}),
  update:patch=>post("/api/update",{c:col,id,patch}).then(()=>{later(col)}).catch(e=>{if(e.code==="http_404")throw{code:"invalid_argument",message:"文档不存在"};throw e}),
  delete:()=>post("/api/delete",{c:col,id}).then(()=>{later(col)})}}
const db={collection:c=>coll(c),doc:p=>{const i=p.indexOf("/");return docRef(p.slice(0,i),p.slice(i+1))}};
const assets={async upload(file){const r=await fetch("/api/upload",{method:"POST",headers:{"X-Filename":encodeURIComponent(file.name||"file")},body:file});const j=await r.json();if(!r.ok)throw{code:"upload_failed",message:j.error};return j},
  async delete(id){return post("/api/delete_file",{id})},async list(){return{assets:[],usage:{}}}};
async function sample(input,opts){opts=opts||{};const messages=typeof input==="string"?[{role:"user",content:input}]:input;
  const r=await fetch("/api/llm",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages,tier:opts.modelTier,max_tokens:opts.maxTokens,thinking:opts.thinking}),signal:opts.signal});
  if(!r.ok){let j={};try{j=await r.json()}catch(e){}throw{code:/还没有填写 API Key/.test(j.error||"")?"nokey":"api",message:j.error||("HTTP "+r.status)}}
  const rd=r.body.getReader();const dec=new TextDecoder();let text="";
  try{for(;;){const {done,value}=await rd.read();if(done)break;const delta=dec.decode(value,{stream:true});text+=delta;opts.onText&&opts.onText({text,delta})}}
  catch(e){if(e.name==="AbortError"){e.text=text}throw e}
  return{text,truncated:false}}
const downloads={async save({filename,data}){const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return{saved:true}}};
const user={can:async()=>true,isOwner:()=>true,canEdit:()=>true};
window.claude={use:async n=>({db,assets,sample,downloads,user})[n]||null};
window.__api={post,get};
})();
</script>
<script>
(function(){
const DIRS={"其他":"--d-other"};
const DIR_COLORS=["--d-gen","--d-wm","--d-protect","--d-transfer","--d-detect","--d-adv","--d-crypt"];
/* 论文分类在“设置”里填；文库里出现的其他分类名也会自动加进来 */
function rebuildDirs(){let names=[];try{names=((CFG&&CFG.dirs)||[]).map(x=>String(x).trim()).filter(Boolean)}catch(e){}
  for(const p of (S.papers||[]))if(p.direction&&!names.includes(p.direction))names.push(p.direction);
  names=names.filter(x=>x!=="其他");for(const k of Object.keys(DIRS))delete DIRS[k];
  names.forEach((n,i)=>DIRS[n]=DIR_COLORS[i%DIR_COLORS.length]);DIRS["其他"]="--d-other"}
const KINDS=["精读","泛读","推荐","已读","待读"];
/* 已读标记：与“类型”（精读/泛读/推荐…）分开记录，readAt 为读完日期；类型为“已读”的老条目也算读完 */
const isRead=p=>!!(p&&(p.readAt||p.kind==="已读"));
function toggleRead(p){if(!p)return Promise.resolve();
  if(p.readAt)return upd("papers/"+p.id,{readAt:null});
  if(p.kind==="已读")return Promise.resolve();
  return upd("papers/"+p.id,{readAt:new Date().toISOString().slice(0,10)})}
function readBtn(p,cls){if(!p||!S.canWrite||!S.db)return isRead(p)?h("span",{class:"chip readchip"},"✓ 已读"):null;
  const done=isRead(p);const legacy=done&&!p.readAt;
  const b=h("button",{class:"btn sm readbtn"+(done?" done":" primary")+(cls?" "+cls:""),title:legacy?"类型为“已读”，可在详情的“类型”里修改":(done?"读完于 "+p.readAt+"，点击撤销":"把这篇标记为已读完"),disabled:legacy?"disabled":null,
    onclick:e=>{e.stopPropagation();const was=isRead(p);toggleRead(p).then(()=>{b.textContent=was?"标为已读":"✓ 已读完";b.classList.toggle("done",!was);b.classList.toggle("primary",was)})}},done?"✓ 已读完":"标为已读");
  return b}
const STATUSES=["待定","保留","放弃","已做"];
const ST_COLOR={"待定":"var(--line)","保留":"var(--ok)","放弃":"var(--bad)","已做":"var(--done)"};
const START=Date.UTC(2026,8,29);
const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";const PDFJS2="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/";
const S={papers:[],ideas:[],briefs:[],cols:[],topics:[],tdocs:[],topicSel:null,tab:"lib",
  lib:{f:"all",v:null,q:"",scope:"all",sort:"added",dir:"desc",sel:null,pane:"info",adding:false,newCol:false,editCol:null,confirm:null},
  briefDate:null,ideaStatus:"全部",ideaDir:"全部",
  db:null,assets:null,sample:null,downloads:null,canWrite:true,
  loaded:{papers:false,ideas:false,briefs:false,cols:false,topics:false},fulltext:null};
try{const t=localStorage.getItem("rd-tab");if(t)S.tab=t;const p=localStorage.getItem("rd-pane");if(p)S.lib.pane=p}catch(e){}
if(location.hash){const t=location.hash.slice(1);if(["lib","topics","brief","ideas","tujie","progress","plan"].includes(t))S.tab=t}

/* ---------- helpers ---------- */
function h(tag,attrs,...kids){const el=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==="class")el.className=v;else if(k==="style")el.setAttribute("style",v);else if(k==="value")el.value=v;else if(k.startsWith("on"))el.addEventListener(k.slice(2),v);else el.setAttribute(k,v===true?"":v)}for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(String(c)))}return el}
function dirChip(d){const k=DIRS[d]?d:"其他";return h("span",{class:"chip dir",style:"--c:var("+DIRS[k]+")"},k)}
function link(url,text){return url?h("a",{href:url,target:"_blank",rel:"noopener"},text):text}
function showNotice(t){if(!t)return;document.getElementById("notice-text").textContent=t;document.getElementById("notice").hidden=false;
  let open=false;try{open=!!R.id}catch(e){}
  if(open){let el=document.getElementById("rtoast");if(!el){el=h("div",{id:"rtoast",class:"rtoast",role:"status"});document.body.append(el)}
    el.replaceChildren(h("span",null,t),h("button",{class:"linkbtn",onclick:()=>el.remove()},"关闭"));clearTimeout(el._t);el._t=setTimeout(()=>el.remove(),12000)}}
document.getElementById("notice-x").addEventListener("click",()=>{document.getElementById("notice").hidden=true});
function fmtSize(b){if(!b)return"";return b>1048576?(b/1048576).toFixed(1)+" MB":Math.round(b/1024)+" KB"}
function addedKey(p){return p.addedAt||p.briefDate||""}
function arxivLink(p){return p.link||(p.arxiv?"https://arxiv.org/abs/"+p.arxiv:null)}
function pdfLink(p){return p.arxiv?"https://arxiv.org/pdf/"+p.arxiv:null}
const isArxiv=s=>/^\d{4}\.\d{4,5}(v\d+)?$/.test(s);

/* write queue: one write at a time per document */
const wq={};
function upd(path,patch){if(!S.db||!S.canWrite)return Promise.resolve();const p=(wq[path]||Promise.resolve()).then(()=>S.db.doc(path).update(patch)).catch(handleWriteErr);wq[path]=p;return p}
function handleWriteErr(e){if(e&&e.code==="invalid_argument"){S.canWrite=false;showNotice("你当前的权限只能查看，修改无法保存。");render()}else if(e&&e.code==="quota_exceeded"){showNotice("存储空间已满："+(e.message||""))}else showNotice("保存没有成功（"+(e&&e.code||"未知错误")+"），请稍后再试。")}

/* ---------- plan progress ---------- */
function shanghaiToday(){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Shanghai",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date())}
function dayOf(iso){const [y,m,d]=iso.split("-").map(Number);return Math.round((Date.UTC(y,m-1,d)-START)/864e5)+1}
function phase(n){if(n<=7)return"第 1 周 · 选定子方向、画分类图";if(n<=14)return"第 2 周 · 精读核心论文";if(n<=21)return"第 3 周 · 阅读与复现过渡";if(n<=28)return"第 4 周 · 复现最小实验";return"研究计划撰写与每周复盘"}
function renderDayline(){const today=shanghaiToday();const n=dayOf(today);const w=Math.ceil(n/7);const wd=["周日","周一","周二","周三","周四","周五","周六"][new Date(today+"T12:00:00+08:00").getDay()];
  document.getElementById("dayline").replaceChildren(h("b",null,"第 "+n+" 天 / 第 "+w+" 周")," · "+today+" "+wd);
  document.getElementById("phaseline").textContent=phase(n);
  const tr=document.getElementById("track");tr.replaceChildren();
  for(let i=1;i<=29;i++){const c=i<=7?"p1":i<=21?"p2":i<=28?"p3":"p4";tr.append(h("i",{class:c+(i<n?" past":"")+((i===n||(i===29&&n>=29))?" today":"")}))}}

function zIds(){return S.cols.filter(c=>c.source==="Zotero").map(c=>c.id)}
function colDesc(id){const out=[id];for(const c of S.cols.filter(x=>x.parent===id))out.push(...colDesc(c.id));return out}
function colName(id){const c=S.cols.find(x=>x.id===id);if(!c)return null;const p=c.parent?colName(c.parent):null;return p?p+" / "+c.name:c.name}
function filtered(){const L=S.lib;let list=S.papers.slice();
  if(L.f==="dir")list=list.filter(p=>(DIRS[p.direction]?p.direction:"其他")===L.v);
  else if(L.f==="col"){const ids=colDesc(L.v);list=list.filter(p=>(p.collections||[]).some(x=>ids.includes(x)))}
  else if(L.f==="tag")list=list.filter(p=>(p.tags||[]).includes(L.v));
  else if(L.f==="unfiled")list=list.filter(p=>!DIRS[p.direction]);
  else if(L.f==="pdf")list=list.filter(p=>p.assetId);
  else if(L.f==="kind")list=list.filter(p=>p.kind===L.v);
  else if(L.f==="read")list=list.filter(p=>L.v==="已读完"?isRead(p):!isRead(p));
  else if(L.f==="recent"){const cut=new Date(Date.now()-14*864e5).toISOString().slice(0,10);list=list.filter(p=>addedKey(p)>=cut)}
  const q=L.q.trim().toLowerCase();
  if(q){const toks=q.split(/\s+/);list=list.filter(p=>{let hay;
      if(L.scope==="title")hay=(p.title||"");
      else if(L.scope==="author")hay=(p.authors||"");
      else{hay=[p.title,p.authors,p.arxiv,p.venue,p.doi,p.abstract,p.contribution,p.threat,p.relevance,p.advice,p.notes,(p.tags||[]).join(" "),(p.zoteroCollections||[]).join(" "),(p.excerpts||[]).map(e=>e.text+" "+(e.translation||"")+" "+(e.comment||"")).join(" ")].join(" ");
        if(L.scope==="full"&&S.fulltext&&S.fulltext[p.id])hay+=" "+S.fulltext[p.id]}
      hay=hay.toLowerCase();return toks.every(t=>hay.includes(t))})}
  const k=L.sort,dir=L.dir==="asc"?1:-1;
  const val=p=>k==="title"?(p.title||"").toLowerCase():k==="authors"?(p.authors||"").toLowerCase():k==="date"?(p.date||""):k==="dir"?(p.direction||""):addedKey(p);
  list.sort((a,b)=>{const x=val(a),y=val(b);return x<y?-dir:x>y?dir:0});
  return list}

async function createFromPdf(file){if(!S.db)return;const base=file.name.replace(/\.pdf$/i,"");const m=base.match(/\d{4}\.\d{4,5}/);const ax=m?m[0]:"";

  if(ax&&S.papers.some(p=>p.id===ax)){await attachPdf(ax,file);S.lib.sel=ax;render();return}
  try{await S.db.doc("papers/"+id).set({title:ax?"arXiv:"+ax+"（待补标题）":base,authors:"",date:"",arxiv:ax,link:ax?"https://arxiv.org/abs/"+ax:"",direction:"其他",kind:"待读",addedAt:new Date().toISOString(),tags:[],collections:(S.lib.f==="col"?[S.lib.v]:[]),notes:"",excerpts:[]});
    S.lib.sel=id;await attachPdf(id,file);render();autoFillLater(id)}catch(e){handleWriteErr(e)}}

    const prim=S.papers.find(p=>p.zoteroPdf===f.name||(!p.zoteroPdf&&p.pdfName===f.name));

  wrap.style.width=vp.width+"px";wrap.style.height=vp.height+"px";wrap.prepend(c);paintPageHL(wrap,n);
  await page.render({canvasContext:c.getContext("2d"),viewport:vp,transform:ratio!==1?[ratio,0,0,ratio,0,0]:null}).promise;
  const tl=h("div",{class:"textLayer"});tl.style.setProperty("--scale-factor",String(vp.scale));wrap.append(tl);
  const tc=await page.getTextContent();R.texts[n]=R.texts[n]||tc.items.map(it=>it.str+(it.hasEOL?"\n":"")).join("");
  const task=pdfjsLib.renderTextLayer({textContentSource:tc,container:tl,viewport:vp,textDivs:[]});await task.promise;bindTextLayer(tl)}catch(e){wrap.dataset.done=""}}

/* 跨行连续划词：照搬 pdf.js 官方阅读器做法。按下鼠标时让 endOfContent 铺满整页，鼠标经过行间空白不会把选区甩到页首；
   Chrome / Safari 里再把 endOfContent 挪到选区端点旁边，防止拖动时选区乱跳。 */
const TLS=new Map();let tlPrev=null;
function bindTextLayer(tl){const end=h("div",{class:"endOfContent"});tl.append(end);TLS.set(tl,end);
  tl.addEventListener("mousedown",()=>tl.classList.add("selecting"))}
function tlReset(end,tl){tl.append(end);end.style.width="";end.style.height="";tl.classList.remove("selecting")}
function tlResetAll(){for(const [tl,end] of TLS){if(!tl.isConnected)TLS.delete(tl);else tlReset(end,tl)}tlPrev=null}
document.addEventListener("pointerup",()=>{for(const [tl,end] of TLS)if(tl.isConnected)tl.classList.remove("selecting")});
window.addEventListener("blur",tlResetAll);
document.addEventListener("keyup",()=>{for(const [tl] of TLS)tl.classList.remove("selecting")});
document.addEventListener("selectionchange",()=>{if(!TLS.size)return;const s=document.getSelection();if(!s||!s.rangeCount){tlResetAll();return}
  const act=new Set();for(let i=0;i<s.rangeCount;i++){const rg=s.getRangeAt(i);for(const tl of TLS.keys())if(!act.has(tl)&&tl.isConnected&&rg.intersectsNode(tl))act.add(tl)}
  for(const [tl,end] of TLS){if(!tl.isConnected){TLS.delete(tl);continue}if(act.has(tl))tl.classList.add("selecting");else tlReset(end,tl)}
  if(/firefox/i.test(navigator.userAgent))return;
  const rg=s.getRangeAt(0);const modStart=tlPrev&&(rg.compareBoundaryPoints(Range.END_TO_END,tlPrev)===0||rg.compareBoundaryPoints(Range.START_TO_END,tlPrev)===0);
  let a=modStart?rg.startContainer:rg.endContainer;if(a.nodeType===Node.TEXT_NODE)a=a.parentNode;
  const tl=a&&a.parentElement&&a.parentElement.closest(".textLayer");const end=tl&&TLS.get(tl);
  if(end&&!a.classList.contains("endOfContent")){end.style.width=tl.style.width;end.style.height=tl.style.height;a.parentElement.insertBefore(end,modStart?a:a.nextSibling)}
  tlPrev=rg.cloneRange()});

function goPage(n){if(!R.doc)return;n=Math.max(1,Math.min(R.doc.numPages,n));if(n!==R.page)setTimeout(showCachedPage,0);const el=document.querySelector('.pg-wrap[data-p="'+n+'"]');if(el)el.scrollIntoView({block:"start"});R.page=n;const pi=document.getElementById("r-pg");if(pi)pi.value=String(n)}
async function zoom(d){R.scale=Math.max(0.6,Math.min(3,R.scale+d));const z=document.getElementById("r-zoom");if(z)z.textContent=Math.round(R.scale*100)+"%";const keep=R.page;await layoutPages();goPage(keep)}
async function pageText(n){if(R.texts[n])return R.texts[n];const page=await R.doc.getPage(n);const tc=await page.getTextContent();R.texts[n]=tc.items.map(it=>it.str+(it.hasEOL?"\n":"")).join("");return R.texts[n]}

async function buildFulltext(p){if(!S.db||!R.doc||!S.canWrite)return;const id=p.id;
  try{const ex=await S.db.doc("fulltext/"+id).get();if(ex.exists&&ex.data().asset===p.assetId)return;
    let txt="";for(let i=1;i<=R.doc.numPages&&R.id===id;i++){txt+=(await pageText(i))+"\n";if(txt.length>200000)break}
    if(R.id!==id)return;await S.db.doc("fulltext/"+id).set({text:txt.slice(0,200000),pages:R.doc.numPages,asset:p.assetId,at:new Date().toISOString()});
    if(S.fulltext)S.fulltext[id]=txt.slice(0,200000)}catch(e){}}

function captureSel(){const s=window.getSelection();const t=s?s.toString().trim():"";if(t&&t!==R.sel){R.sel=t.replace(/\s*\n\s*/g," ");
  let node=s.anchorNode;while(node&&!(node.dataset&&node.dataset.p))node=node.parentNode;R.selPage=node?+node.dataset.p:R.page;
  const sb=document.getElementById("r-sel");if(sb)sb.textContent=R.sel;const qs=document.getElementById("qa-sel");if(qs)qs.textContent="已选中：“"+R.sel.slice(0,80)+(R.sel.length>80?"…":"")+"”";const b=document.querySelectorAll(".needsel");b.forEach(x=>x.disabled=!R.sel)}}

let rsTab="tr";
function renderReaderSide(){const side=document.querySelector(".rside");if(!side)return;const base=S.papers.find(x=>x.id===R.id);const p=R.vp&&R.vp.virtual?R.vp:(R.vp&&R.vp.altView&&base?Object.assign({},base,{assetId:R.vp.assetId,title:R.vp.title}):base);if(!p)return;
  side.replaceChildren(h("div",{class:"panetabs",role:"tablist"},[["tr","翻译"],["ask","问答"],["rel","相关"],["notes","笔记"]].map(([k,t])=>h("button",{role:"tab","aria-selected":rsTab===k?"true":"false",onclick:()=>{rsTab=k;renderReaderSide()}},t))));
  const body=h("div",{class:"panebody"});
  if(rsTab==="tr"){
    if(!S.sample){body.append(h("div",{class:"empty"},"翻译功能不可用。"))}
    else{const out=h("div",{class:"trout",id:"r-out"},R.lastOut||"选中 PDF 中的文字后点“翻译选中”，或直接“翻译本页”。");
      body.append(h("div",null,h("p",{class:"eyebrow"},"选中的文字"),h("div",{class:"selbox",id:"r-sel"},R.sel||"（尚未选中）")),
        h("div",{class:"rowbtns"},
          h("button",{class:"btn primary needsel",disabled:!R.sel,onclick:()=>runSample("sel",p)},"翻译选中"),
          h("button",{class:"btn needsel",disabled:!R.sel,onclick:()=>runSample("explain",p)},"解释选中"),
          h("button",{class:"btn",onclick:()=>runSample("page",p)},"翻译本页"),
          h("button",{class:"btn",onclick:()=>runSample("summary",p)},"本页要点")),
        h("div",null,h("p",{class:"eyebrow"},"结果"),out),
        h("div",{class:"rowbtns"},h("button",{class:"btn needsel",disabled:!R.sel||S.canWrite===false||!!p.virtual,onclick:()=>addExcerpt(p)},"加入摘录"),
          h("button",{class:"btn",onclick:()=>{if(R.abort)R.abort.abort()}},"停止")),
        h("p",{class:"small",style:"margin:0"},"整页翻译会缓存，下次打开同一页直接显示。翻译由 "+modelLabel()+" 生成，关键结论请对照原文。"))}}
  else if(rsTab==="ask")body.append(qaBlock(p));
  else if(rsTab==="rel")body.append(relBlock(p));
  else body.append(p.virtual?h("div",{class:"empty"},"这份材料不是文库条目，笔记请写在组会专题的讨论记录里。"):notesBlock(p,!S.canWrite||!S.db));
  side.append(body)}

/* 整页翻译缓存：按 论文 + 页码 存（不随 PDF 文件位置变化）；翻到已翻译过的页时右侧自动显示 */
function trKey(p,n,mode){return (p.id+(p.altView?"__alt":"")+"__p"+n+(mode==="summary"?"__sum":"")).replace(/[^A-Za-z0-9_\-.~:@+]/g,"_")}
let cacheT=null;
function showCachedPage(){clearTimeout(cacheT);cacheT=setTimeout(async()=>{const out=document.getElementById("r-out");const p=R.vp;
  if(!out||!p||!S.db||rsTab!=="tr"||out.classList.contains("loading")||(R.lastMode&&R.lastMode!=="page"))return;
  const n=R.page;try{const c=await S.db.doc("translations/"+trKey(p,n,"page")).get();
    if(c.exists&&R.page===n&&!out.classList.contains("loading")){out.className="trout";out.textContent="【第 "+n+" 页 · 已缓存的翻译】\n"+c.data().text;R.lastOut=c.data().text;R.lastMode="page"}}catch(e){}},400)}

async function runSample(mode,p){const out=document.getElementById("r-out");if(!out||!S.sample)return;
  if(R.abort)R.abort.abort();R.abort=new AbortController();
  let prompt,cacheKey=null,n=R.page;
  const ctx="论文标题："+(p.title||"")+"\n";
  if(mode==="sel"){if(!R.sel)return;prompt="你是计算机安全与机器学习方向的学术翻译。把下面论文片段翻译成准确、通顺的中文。专业术语首次出现时在括号中保留英文，公式、符号、变量名、引用编号原样保留。只输出译文。\n"+ctx+"\n原文：\n"+R.sel}
  else if(mode==="explain"){if(!R.sel)return;prompt="你是一位帮研究生读论文的导师。用中文简洁解释下面这段论文内容：先用一两句说它在讲什么，再解释其中的关键术语或公式含义，最后一句说明它在这篇论文里的作用。不超过 200 字。\n"+ctx+"\n片段：\n"+R.sel}
  else{n=R.page;let txt="";try{txt=await pageText(n)}catch(e){}
    if(!txt.trim()){out.textContent="这一页没有可提取的文字（可能是扫描图片）。";return}
    cacheKey=trKey(p,n,mode);
    if(S.db){try{const c=await S.db.doc("translations/"+cacheKey).get();if(c.exists){out.className="trout";out.textContent=c.data().text;R.lastOut=c.data().text;R.lastMode=mode;return}}catch(e){}}
    prompt=mode==="summary"?"用中文列出下面这页论文内容的 3–5 个要点，每条一句，保留关键数字和术语英文。只输出要点。\n"+ctx+"第 "+n+" 页原文：\n"+txt.slice(0,12000)
      :"你是计算机安全与机器学习方向的学术翻译。把下面这一页论文文本翻译成准确、通顺的中文，按原段落分段。提取的文本可能有断行和页眉页脚，请合并断行、略去页眉页码。术语首次出现时括注英文，公式与符号原样保留。只输出译文。\n"+ctx+"第 "+n+" 页原文：\n"+txt.slice(0,12000)}
  out.className="trout loading";out.textContent=modelLabel()+" 正在处理";
  try{const r=await S.sample(prompt,{signal:R.abort.signal,modelTier:mode==="sel"||mode==="explain"?"quick":"default",onText:u=>{out.className="trout";out.textContent=u.text}});
    out.className="trout";out.textContent=r.text;R.lastOut=r.text;R.lastMode=mode;
    if(cacheKey&&S.db&&S.canWrite){try{await S.db.doc("translations/"+cacheKey).set({text:r.text,asset:p.assetId,page:n,at:new Date().toISOString()})}catch(e){}}}
  catch(e){out.className="trout";if(e&&e.code==="not_granted"){out.textContent="翻译功能不可用。"}else if(e&&e.code==="rate_limited"){out.textContent="请求太频繁，请稍等一会儿再试。"}else if(e&&e.name==="AbortError"){out.textContent=(e.text||out.textContent)+"\n（已停止）"}else{out.textContent="没有完成："+(e&&e.message||e&&e.code||"未知错误");if(e&&e.code==="nokey")out.append(h("div",null,h("button",{class:"btn sm",style:"margin-top:8px",onclick:openSettings},"去设置 API Key")))}}}

async function addExcerpt(p){if(!R.sel||p.virtual)return;const tr=(R.lastMode==="sel"&&R.lastOut)?R.lastOut:"";
  await upd("papers/"+p.id,{excerpts:[...(p.excerpts||[]),Object.assign({text:R.sel,translation:tr,page:R.selPage||R.page,at:new Date().toISOString()},R.vp&&R.vp.altView?{view:"alt"}:{})]});
  const out=document.getElementById("r-out");if(out){out.textContent=(out.textContent||"")+"\n\n已加入摘录（第 "+(R.selPage||R.page)+" 页）。"}}


/* ---------- 整篇 PDF 中英对照（本机 pdf2zh_next） ---------- */
function trBtn(p){if(!p||p.virtual)return null;const base=S.papers.find(x=>x.id===p.id);if(!base)return null;
  if(p.altView)return h("button",{class:"btn sm",onclick:()=>openReader(p.id)},"看原文");
  if(base.pdfAlt)return h("button",{class:"btn sm primary",onclick:()=>openReader(p.id,{alt:true})},"中英对照");
  const b=h("button",{class:"btn sm",id:"r-trall",title:"把整篇论文翻成中英对照版（保留排版，需要几分钟；第一次用要先双击“安装全文翻译”）",onclick:()=>startFullTr(p.id)},"全文翻译");
  __api.get("/api/pdf_translate?id="+encodeURIComponent(p.id)).then(j=>{if(j.state==="running")pollFullTr(p.id)}).catch(()=>{});
  return b}
async function startFullTr(id){const b=document.getElementById("r-trall");if(b){b.disabled=true;b.textContent="启动中…"}
  const fail=m=>{if(b){b.disabled=false;b.textContent="全文翻译"}showNotice(m)};
  try{const j=await __api.post("/api/pdf_translate",{id});
    if(j.error)return fail(j.error);if(j.state==="done")return fullTrDone(id,j);pollFullTr(id)}
  catch(e){fail(e&&(e.code==="http_404"||/not found/i.test(e.message||""))?"研究台后台还是旧版本，请关掉研究台的终端窗口，再双击「启动研究台.command」重启后再试。":"全文翻译没有启动："+(e&&(e.message||e.code)||""))}}
const trPolls={};
function pollFullTr(id){if(trPolls[id])return;
  const tick=async()=>{let j;try{j=await __api.get("/api/pdf_translate?id="+encodeURIComponent(id))}catch(e){j={state:"running",msg:"等待研究台响应"}}
    const b=document.getElementById("r-trall");
    if(j.state==="running"){if(b&&R.id===id){b.disabled=true;const mins=Math.floor((j.elapsed||0)/60);b.textContent="翻译中 · "+(j.stage?j.stage+" · ":"")+(mins?"已用 "+mins+" 分钟":"刚开始");b.title=j.msg||""}trPolls[id]=setTimeout(tick,3000);return}
    delete trPolls[id];
    if(j.state==="done")fullTrDone(id,j);
    else{if(b){b.disabled=false;b.textContent="全文翻译"}showNotice((j.msg||"全文翻译失败")+(j.log&&j.log.length?"：\n"+j.log.slice(-3).join("\n"):""))}};
  tick()}
async function fullTrDone(id,j){const p=S.papers.find(x=>x.id===id);try{const d=await S.db.doc("papers/"+id).get();if(p&&d.exists)Object.assign(p,d.data())}catch(e){}
  if(R.id===id&&p&&p.pdfAlt)openReader(id,{alt:true});else showNotice("《"+((p&&p.title)||id)+"》的中英对照版已生成，点“对照版”就能看。")}

/* ---------- 问答：围绕当前论文提问（术语、概念、方法），回答结合论文原文 ---------- */
const QA={};
function qaList(p){if(!QA[p.id]){const base=S.papers.find(x=>x.id===p.id);QA[p.id]=((base&&base.chat)||[]).slice()}return QA[p.id]}
function myFocus(){try{return ((CFG&&CFG.focus)||"").trim()}catch(e){return ""}}
function focusNote(){const f=myFocus();return f?"（学生的研究方向："+f+"）":""}
const QA_QUICK=[["讲了什么","用通俗的话讲讲这篇论文要解决什么问题、核心思路是什么、主要结论是什么。"],
  ["方法流程","按步骤讲清楚这篇论文的方法流程：每一步的输入、输出和作用，关键公式里每个符号的含义。"],
  ["本页难点","解释我当前这一页里最难理解的概念、公式或实验设置。"],
  ["和我的方向","这篇论文和我的研究方向（{FOCUS}）有什么联系？有哪些可以借鉴或改进的点？"]];
function qaBlock(p){const list=qaList(p);
  const log=h("div",{class:"qalog",id:"qa-log"});
  if(!list.length)log.append(h("p",{class:"small",style:"margin:0"},"可以问这篇论文里的术语、公式、方法细节，或者让它联系你的研究方向。回答会结合论文原文；在 PDF 里选中一个词，再点“解释选中”最方便。"));
  for(const m of list)log.append(m.role==="user"?h("div",{class:"qa-q"},m.text):m.pending?h("div",{class:"qa-a",id:"qa-pending"},m.text?mdBlock(m.text):modelLabel()+" 正在思考…"):h("div",{class:"qa-a"},mdBlock(m.text)));
  const ta=h("textarea",{class:"box",id:"qa-in",rows:"3",placeholder:"输入问题，Enter 发送，Shift+Enter 换行"});
  ta.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();askQA(p,ta.value)}});
  const box=h("div",{class:"qa"},log,
    h("div",{class:"qa-sel small",id:"qa-sel"},R.sel?"已选中：“"+R.sel.slice(0,80)+(R.sel.length>80?"…":"")+"”":"在 PDF 里选中文字后，可以直接问它的意思。"),
    h("div",{class:"rowbtns"},h("button",{class:"btn sm primary needsel",disabled:!R.sel,onclick:()=>askSel(p)},"解释选中"),QA_QUICK.map(([t,q])=>h("button",{class:"btn sm",onclick:()=>askQA(p,q.replace("（{FOCUS}）",myFocus()?"（"+myFocus()+"）":""),t)},t))),
    ta,
    h("div",{class:"rowbtns"},h("button",{class:"btn primary",onclick:()=>askQA(p,ta.value)},"发送"),h("button",{class:"btn",onclick:()=>{if(R.abort)R.abort.abort()}},"停止"),
      h("button",{class:"btn",onclick:()=>{QA[p.id]=[];if(!p.virtual&&S.canWrite)upd("papers/"+p.id,{chat:[]});renderReaderSide()}},"清空对话")));
  setTimeout(()=>{log.scrollTop=log.scrollHeight},0);return box}
function askSel(p){if(!R.sel)return;askQA(p,"解释一下「"+R.sel+"」：先给出简明定义，再说明它在这篇论文里的具体含义和作用，必要时举个例子。","解释「"+R.sel.slice(0,120)+(R.sel.length>120?"…":"")+"」")}
async function paperText(p){let t=(S.fulltext&&S.fulltext[p.id])||"";
  if(!t&&R.doc){for(let i=1;i<=R.doc.numPages&&t.length<60000;i++){try{t+=(await pageText(i))+"\n"}catch(e){}}}return t}
async function askQA(p,q,shown){q=(q||"").trim();if(!q)return;if(!S.sample){showNotice("问答功能不可用，请先在设置里填写 API Key。");return}
  const list=qaList(p);if(list.some(m=>m.pending))return;
  const hist=list.slice(-8).map(m=>(m.role==="user"?"学生：":"助手：")+(m.q||m.text)).join("\n\n");
  list.push({role:"user",text:shown||q,q,at:new Date().toISOString()});const m={role:"assistant",text:"",pending:true};list.push(m);
  rsTab="ask";renderReaderSide();
  const paint=()=>{const el=document.getElementById("qa-pending");if(el){el.replaceChildren(m.text?mdBlock(m.text):modelLabel()+" 正在思考…");const lg=document.getElementById("qa-log");if(lg)lg.scrollTop=lg.scrollHeight}};
  if(R.abort)R.abort.abort();R.abort=new AbortController();
  const full=await paperText(p);let cur="";try{cur=await pageText(R.page)}catch(e){}
  const prompt="你是一位耐心的导师，正在帮一位研究生读论文"+focusNote()+"。根据下面的论文原文回答学生的问题。要求：用中文；先给结论再解释；术语保留英文原词；涉及公式时说明每个符号的含义；论文里没写、属于你补充的背景知识要明确标出“（补充）”；简洁，用短段落或列表。\n\n论文标题："+(p.title||"")+"\n\n论文原文（节选）：\n"+full.slice(0,40000)+"\n\n学生当前在看第 "+R.page+" 页，该页原文：\n"+cur.slice(0,6000)+(hist?"\n\n之前的对话：\n"+hist:"")+"\n\n学生的问题："+q;
  try{const r=await S.sample(prompt,{signal:R.abort.signal,modelTier:"default",onText:u=>{m.text=u.text;paint()}});
    m.text=r.text;delete m.pending;
    if(!p.virtual&&S.canWrite)upd("papers/"+p.id,{chat:list.filter(x=>!x.pending&&!x.err).slice(-40)})}
  catch(e){delete m.pending;m.err=true;m.text=(m.text?m.text+"\n\n":"")+(e&&e.name==="AbortError"?"（已停止）":e&&e.code==="nokey"?"还没有设置 API Key，请在设置里填写。":"没有完成："+(e&&e.message||e&&e.code||"未知错误"))}
  if(rsTab==="ask")renderReaderSide()}

    const prompt="你是一位擅长费曼学习法的老师。下面是一篇论文的原文。请假设听众是没学过这个领域的高中生，用费曼学习法讲清这篇论文主要干了啥。要求：中文；不用术语，非用不可时立刻用一句大白话解释；只依据论文原文，不编造。只输出一个 JSON 对象，不要代码块，结构：\n{\"plain\": \"150-250 字的大白话讲解：这篇论文要解决什么问题、怎么解决、效果如何、为什么重要\", \"analogy\": \"一个贯穿全文的生活类比，把论文里的关键角色一一对应\", \"steps\": [\"用类比和大白话分 3-5 步讲它是怎么做到的\"], \"pitfalls\": [{\"wrong\": \"初学者容易有的误解\", \"right\": \"正确的理解\"}], \"recap\": \"20 字以内的一句话复述\"}\npitfalls 2-3 条。\n\n论文标题："+(p.title||"")+"\n\n论文原文：\n"+text.slice(0,60000);
    const r=await S.sample(prompt,{signal:R.abort.signal,modelTier:"default",maxTokens:4000,thinking:false,onText:u=>{st.feyText=u.text;const el=document.getElementById("dx-fprog");if(el)el.textContent="已生成 "+u.text.length+" 字"}});

/* ---------- 相关论文：文库里的相似论文 + Semantic Scholar 推荐 / 参考文献 / 后续引用 ---------- */
const REL={};let relSub="rec";
const STOP=new Set("with from that this have been were their which these using based into than more such also over under between through about other image images model models method methods learning deep paper approach network networks data results show propose proposed via toward towards".split(" "));
function words(t){return new Set(((t||"").toLowerCase().match(/[a-z][a-z\-]{3,}/g)||[]).filter(w=>!STOP.has(w)))}
function normT(t){return (t||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim()}
function libRelated(p){const me=S.papers.find(x=>x.id===p.id)||p;const W=words(me.title+" "+(me.abstract||""));const full=normT((S.fulltext&&S.fulltext[me.id])||"");const mt=new Set(me.tags||[]);
  return S.papers.filter(x=>x.id!==me.id).map(x=>{const w=words(x.title+" "+(x.abstract||""));let inter=0;w.forEach(t=>{if(W.has(t))inter++});
    let sc=inter/Math.sqrt((w.size||1)*(W.size||1))*10;const why=[];
    if(x.direction&&x.direction===me.direction){sc+=1.5;why.push(x.direction)}
    const st=(x.tags||[]).filter(t=>mt.has(t));if(st.length){sc+=st.length;why.push("标签 "+st.slice(0,2).join("、"))}
    const nt=normT(x.title);if(full&&nt.length>20&&full.includes(nt.slice(0,45))){sc+=6;why.unshift("本文引用了它")}
    return {x,sc,why}}).filter(r=>r.sc>2).sort((a,b)=>b.sc-a.sc).slice(0,8)}
function inLib(r){const t=normT(r.title);return S.papers.find(x=>(r.arxiv&&x.arxiv&&x.arxiv.replace(/v\d+$/,"")===r.arxiv)||normT(x.title)===t)}
function relCard(r,p){const have=inLib(r);const abs=h("div",{class:"small",style:"display:none;margin-top:6px;white-space:pre-wrap"},r.abstract||"（没有摘要）");
  return h("div",{class:"relcard"},
    h("div",{class:"rt2"},r.link?h("a",{href:r.link,target:"_blank",rel:"noopener"},r.title):r.title),
    h("div",{class:"small"},[r.authors,r.year,r.venue,r.cites?"被引 "+r.cites:""].filter(Boolean).join(" · ")),
    abs,
    h("div",{class:"rowbtns",style:"margin-top:6px"},
      h("button",{class:"linkbtn",onclick:e=>{const o=abs.style.display==="none";abs.style.display=o?"":"none";e.target.textContent=o?"收起摘要":"摘要"}},"摘要"),
      have?h("button",{class:"linkbtn",onclick:()=>have.assetId?openReader(have.id):showNotice("《"+have.title+"》已在文库里，但还没有 PDF。")},have.assetId?"已在文库 · 打开":"已在文库")
        :S.canWrite?h("button",{class:"linkbtn",onclick:async e=>{e.target.disabled=true;await addRelated(r,p);e.target.textContent="已加入文库"}},"加入文库"):null))}
async function addRelated(r,p){const me=S.papers.find(x=>x.id===p.id)||{};const id=r.arxiv||("s2-"+normT(r.title).replace(/ /g,"-").slice(0,40));
  await S.db.doc("papers/"+id).set({title:r.title,authors:r.authors||"",date:r.year?String(r.year):"",arxiv:r.arxiv||"",doi:r.doi||"",link:r.link||"",venue:r.venue||"",abstract:r.abstract||"",
    direction:me.direction||"其他",kind:"待读",addedAt:new Date().toISOString(),tags:[],collections:[],notes:"相关推荐：来自《"+(me.title||"")+"》",excerpts:[]});autoFillLater(id)}
async function loadRel(p,force){REL[p.id]={loading:true};renderReaderSide();
  try{const r=await __api.get("/api/related?id="+encodeURIComponent(p.id)+(force?"&force=1":""));REL[p.id]=r}catch(e){REL[p.id]={error:"没有取到推荐："+(e.message||e.code||"")}}

function relBlock(p){const box=h("div",{class:"rel"});const lib=libRelated(p);

  if(p.virtual)return box;

  if(st.error){box.append(h("p",{class:"small"},st.error),h("button",{class:"btn sm",onclick:()=>loadRel(p,true)},"重试"));return box}
  const subs=[["rec","相似推荐",st.rec],["refs","本文引用的经典",st.refs],["cites","后续引用它的",st.cites]];
  box.append(h("div",{class:"rowbtns"},subs.map(([k,t,l])=>h("button",{class:"btn sm"+(relSub===k?" primary":""),onclick:()=>{relSub=k;renderReaderSide()}},t+" "+((l||[]).length)))));
  const cur=(subs.find(s=>s[0]===relSub)||subs[0])[2]||[];
  box.append(cur.length?h("div",{class:"rellist"},cur.map(r=>relCard(r,p))):h("p",{class:"small"},(relSub==="refs"&&st.refsNote)||(relSub==="cites"&&st.citesNote)||"这一栏没有结果。"),
    h("p",{class:"small",style:"margin:8px 0 0"},"结果缓存一周，更新于 "+(st.at||"").slice(0,16).replace("T"," ")+" · ",h("button",{class:"linkbtn",onclick:()=>loadRel(p,true)},"刷新")));
  return box}

/* =========================================================
   PROGRESS（进度：按日 / 周 / 月 / 年回顾读了什么、做了什么）
   ========================================================= */
const PG={unit:"周",anchor:new Date(),act:null,actAt:0,sum:{}};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const pgDay=s=>{if(!s)return"";const d=new Date(s);return isNaN(d)?String(s).slice(0,10):ymd(d)};
function pgRange(){const a=new Date(PG.anchor);a.setHours(0,0,0,0);let s,e;
  if(PG.unit==="日"){s=a;e=new Date(a);e.setDate(e.getDate()+1)}
  else if(PG.unit==="周"){s=new Date(a);s.setDate(s.getDate()-((s.getDay()+6)%7));e=new Date(s);e.setDate(e.getDate()+7)}
  else if(PG.unit==="月"){s=new Date(a.getFullYear(),a.getMonth(),1);e=new Date(a.getFullYear(),a.getMonth()+1,1)}
  else{s=new Date(a.getFullYear(),0,1);e=new Date(a.getFullYear()+1,0,1)}
  return{s,e,from:ymd(s),to:ymd(new Date(e-864e5))}}
function pgLabel(r){const md=d=>(d.getMonth()+1)+"月"+d.getDate()+"日";
  if(PG.unit==="日")return r.s.getFullYear()+"年"+md(r.s)+" 周"+"日一二三四五六"[r.s.getDay()];
  if(PG.unit==="周")return md(r.s)+" – "+md(new Date(r.e-864e5));
  if(PG.unit==="月")return r.s.getFullYear()+"年"+(r.s.getMonth()+1)+"月";return r.s.getFullYear()+"年"}
function pgShift(k){const a=new Date(PG.anchor);if(PG.unit==="日")a.setDate(a.getDate()+k);else if(PG.unit==="周")a.setDate(a.getDate()+7*k);else if(PG.unit==="月")a.setMonth(a.getMonth()+k);else a.setFullYear(a.getFullYear()+k);PG.anchor=a;render()}
async function pgLoad(force){if(!force&&PG.act&&Date.now()-PG.actAt<30000)return;PG.actAt=Date.now();
  try{const [docs,tr]=await Promise.all([__api.get("/api/list?c=activity"),__api.get("/api/list?c=translations")]);PG.tr=tr;PG.act={};for(const d of docs)PG.act[d.id]=d;if(S.tab==="progress")render()}catch(e){PG.act=PG.act||{}}}
const fmtMin=s=>{const m=Math.round(s/60);return m<60?m+" 分钟":(m/60).toFixed(m<600?1:0)+" 小时"};

/* 把各处带时间的记录汇总成一份“这段时间做了什么” */
function pgCollect(r){const inR=d=>d&&d>=r.from&&d<=r.to;const byId={};S.papers.forEach(p=>byId[p.id]=p);
  const out={read:{},readDay:{},opened:new Set(),kind:[],added:[],ex:[],qa:[],tr:[],ideas:[],briefs:[],dayCount:{}};
  const bump=d=>{out.dayCount[d]=(out.dayCount[d]||0)+1};
  for(const [day,a] of Object.entries(PG.act||{})){if(!inR(day))continue;
    for(const [pid,sec] of Object.entries(a.read||{})){out.read[pid]=(out.read[pid]||0)+sec;out.readDay[day]=(out.readDay[day]||0)+sec}
    for(const ev of a.events||[]){if(ev.type==="open")out.opened.add(ev.pid);else if(ev.type==="kind"){out.kind.push(ev);bump(day)}}}
  for(const p of S.papers){if(inR(pgDay(p.addedAt))){out.added.push(p);bump(pgDay(p.addedAt))}
    for(const e of p.excerpts||[])if(e.source!=="Zotero"&&inR(pgDay(e.at))){out.ex.push(Object.assign({p},e));bump(pgDay(e.at))}
    for(const m of p.chat||[])if(m.role==="user"&&inR(pgDay(m.at))){out.qa.push({p,text:m.text,at:m.at});bump(pgDay(m.at))}}
  for(const t of PG.tr||[])if(t.text&&inR(pgDay(t.at))){out.tr.push(t);bump(pgDay(t.at))}
  for(const i of S.ideas)if(inR(i.date)){out.ideas.push(i);bump(i.date)}
  for(const b of S.briefs)if(inR(b.date))out.briefs.push(b);
  const papers=new Set([...Object.keys(out.read),...out.opened,...out.ex.map(e=>e.p.id),...out.qa.map(q=>q.p.id)]);
  out.papers=[...papers].map(id=>byId[id]).filter(Boolean).map(p=>({p,sec:out.read[p.id]||0,ex:out.ex.filter(e=>e.p.id===p.id).length,qa:out.qa.filter(q=>q.p.id===p.id).length}))
    .filter(x=>x.sec>=30||x.ex||x.qa).sort((a,b)=>b.sec-a.sec||b.ex-a.ex);
  out.total=Object.values(out.read).reduce((a,b)=>a+b,0);
  const dir={};for(const x of out.papers){const d=DIRS[x.p.direction]?x.p.direction:"其他";dir[d]=(dir[d]||0)+(x.sec||60)}out.dir=dir;
  return out}

function pgBars(r,c){/* 阅读时长柱状图：周/月按天，年按月，单一系列 */
  const buckets=[];
  if(PG.unit==="年"){for(let m=0;m<12;m++){let s=0,n=0;for(const [d,v] of Object.entries(c.readDay))if(+d.slice(5,7)===m+1)s+=v;for(const [d,v] of Object.entries(c.dayCount))if(+d.slice(5,7)===m+1)n+=v;buckets.push({k:(m+1)+"月",sec:s,n})}}
  else{for(let d=new Date(r.s);d<r.e;d.setDate(d.getDate()+1)){const k=ymd(d);buckets.push({k:PG.unit==="周"?"周"+"日一二三四五六"[d.getDay()]:String(d.getDate()),full:k,sec:c.readDay[k]||0,n:c.dayCount[k]||0})}}
  const max=Math.max(...buckets.map(b=>b.sec),60);const W=100/buckets.length;

    const col=h("div",{class:"pgcol"},b.sec>0?h("i",{style:"height:"+Math.max(2,b.sec/max*100)+"%"}):null);
    col.addEventListener("pointerenter",()=>{tip.hidden=false;tip.textContent=(b.full||b.k)+"：阅读 "+fmtMin(b.sec)+(b.n?" · "+b.n+" 项操作":"");tip.style.left=((i+0.5)*W)+"%"});

  return h("div",{class:"pgchart"},h("div",{class:"pgaxis small"},"最高 "+fmtMin(max)),h("div",{style:"position:relative"},plot,tip),
    h("div",{class:"pgx"},buckets.map((b,i)=>h("span",{style:"width:"+W+"%"},i%step===0?b.k:""))))}

function pgHeat(r){/* 年视图：每天的活跃度日历，单色深浅 */
  const days=[];const s=new Date(r.s);const pad=(s.getDay()+6)%7;
  const score={};for(const [d,a] of Object.entries(PG.act||{}))score[d]=(score[d]||0)+Object.values(a.read||{}).reduce((x,y)=>x+y,0)/600;

  // 图

    PG.unit==="年"?h("div",{style:"margin-top:16px"},h("h3",null,"每日活跃度"),pgHeat(r)):null));

  if(dirs.length)v.append(h("section",{class:"pgcard"},h("h3",null,"精力花在哪些方向"),h("div",{class:"pgdirs"},dirs.map(([d,s])=>h("div",{class:"pgdir"},

  // 明细

    sec("读的论文 · "+c.papers.length,c.papers.slice(0,30).map(x=>h("div",{class:"pgrow"},h("i",{class:"dot",style:"background:var("+(DIRS[x.p.direction]||"--d-other")+")"}),
      h("a",{href:"#",onclick:e=>{e.preventDefault();if(x.p.assetId)openReader(x.p.id)}},x.p.title),h("span",{class:"small"},[x.sec?fmtMin(x.sec):"",x.ex?x.ex+" 条批注":"",x.qa?"问了 "+x.qa+" 次":"",x.p.kind].filter(Boolean).join(" · "))))),

  ].filter(Boolean));
  v.append(h("p",{class:"small"},"阅读时长从 10 月 20 日开始记录：阅读器开着、并且你在操作时每 30 秒计一次；高亮、批注、问答、新增论文等按各自的时间统计。"))}

async function pgSummary(r,c,key,box){const lines=[
  "时间范围："+pgLabel(r),"阅读总时长："+fmtMin(c.total),
  "读过的论文：\n"+c.papers.slice(0,25).map(x=>"- "+x.p.title+"（"+(x.p.direction||"")+"，"+(x.sec?fmtMin(x.sec):"打开过")+(x.ex?"，"+x.ex+" 条批注":"")+"）").join("\n"),
  c.ex.length?"高亮与批注：\n"+c.ex.slice(0,30).map(e=>"- "+e.text.slice(0,120)+(e.comment?" ｜批注："+e.comment:"")).join("\n"):"",

/* 高亮矩形整理：同一行的碎块合并；上下相邻两行若有重叠，在重叠中线处切开，避免上下行高亮叠在一起变深 */
function normRects(rs){const a=(rs||[]).filter(r=>r&&r.length===4&&r[2]>0&&r[3]>0).map(r=>r.slice()).sort((x,y)=>x[1]-y[1]||x[0]-y[0]);
  for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){const p=a[i],q=a[j];const pb=p[1]+p[3],qb=q[1]+q[3];
    const ov=Math.min(pb,qb)-Math.max(p[1],q[1]);if(ov<=0)continue;
    const hov=Math.min(p[0]+p[2],q[0]+q[2])-Math.max(p[0],q[0]);
    if(Math.abs(p[1]-q[1])<Math.min(p[3],q[3])*0.5){if(hov>-0.01){const l=Math.min(p[0],q[0]),r=Math.max(p[0]+p[2],q[0]+q[2]),t=Math.min(p[1],q[1]),b=Math.max(pb,qb);p[0]=l;p[1]=t;p[2]=r-l;p[3]=b-t;a.splice(j,1);j=i}continue}
    if(hov<=0)continue;const top=p[1]<=q[1]?p:q,bot=top===p?q:p;const tb=top[1]+top[3],bb=bot[1]+bot[3];const mid=(tb+bot[1])/2;top[3]=mid-top[1];bot[1]=mid;bot[3]=bb-mid}
  return a}

/* 选区在某一页上的矩形（相对页面的比例坐标）：同行合并、去掉被包含的碎块和小杂点，上下行不重叠 */
function pageRects(rg,wrap){const wb=wrap.getBoundingClientRect();
  const raw=[...rg.getClientRects()].filter(r=>r.width>1&&r.height>2&&r.height<wb.height*0.08&&r.bottom>wb.top&&r.top<wb.bottom&&r.right>wb.left&&r.left<wb.right).sort((a,b)=>a.top-b.top||a.left-b.left);
  const lines=[];
  for(const r of raw){const l=lines.find(x=>Math.abs(x.top-r.top)<r.height*0.5&&r.left<=x.right+8&&r.right>=x.left-8);
    if(l){l.left=Math.min(l.left,r.left);l.right=Math.max(l.right,r.right);l.top=Math.min(l.top,r.top);l.bottom=Math.max(l.bottom,r.bottom)}
    else lines.push({left:r.left,right:r.right,top:r.top,bottom:r.bottom})}
  let keep=lines.filter(l=>!lines.some(o=>o!==l&&o.right-o.left>l.right-l.left&&o.left<=l.left+1&&o.right>=l.right-1&&Math.min(o.bottom,l.bottom)-Math.max(o.top,l.top)>(l.bottom-l.top)*0.6));
  if(keep.length>1){const hs=keep.map(l=>l.bottom-l.top).sort((a,b)=>a-b);const med=hs[Math.floor(hs.length/2)];keep=keep.filter(l=>l.bottom-l.top>=med*0.45)}
  return normRects(keep.map(l=>[(Math.max(l.left,wb.left)-wb.left)/wb.width,(l.top-wb.top)/wb.height,(Math.min(l.right,wb.right)-Math.max(l.left,wb.left))/wb.width,(l.bottom-l.top)/wb.height]))}

/* ---------- 自动填写论文信息：先免费查基本信息，再让 AI 读论文填写贡献、问题设定等（只填空着的格子） ---------- */
const AUTOF={};let autofChain=Promise.resolve();
function isPlaceholderTitle(p){const t=(p.title||"").trim();if(!t||/（待补标题）$/.test(t))return true;
  const base=(p.pdfName||"").replace(/\.pdf$/i,"").trim();return !!base&&t===base}
function autoFillLater(id,opt){autofChain=autofChain.then(()=>autoFill(id,opt)).catch(()=>{});return autofChain}
async function autoFill(id,opt){opt=opt||{};if(!S.db||!S.canWrite)return;if(AUTOF[id]&&AUTOF[id].running)return;
  const st=AUTOF[id]={running:true,msg:"正在查询论文基本信息…"};render();
  const get=async()=>{const d=await S.db.doc("papers/"+id).get();return d.exists?Object.assign({id},d.data()):null};
  try{let p=await get();if(!p){delete AUTOF[id];return}
    const patch={};const empty=k=>!String(p[k]||"").trim()||opt.force;
    // ① 从 PDF 第一页找 arXiv 编号和 DOI
    let first="";if(p.assetId&&(!p.arxiv||!p.doi||isPlaceholderTitle(p))){try{await loadPdfjs();const doc=await pdfjsLib.getDocument({url:"/_blob/"+p.assetId}).promise;
      for(let i=1;i<=Math.min(2,doc.numPages);i++){const tc=await (await doc.getPage(i)).getTextContent();first+=tc.items.map(x=>x.str).join(" ")+"\n"}}catch(e){}}
    let ax=p.arxiv||((first.match(/arXiv:\s*(\d{4}\.\d{4,5})/i)||[])[1])||"";
    let doi=p.doi||((first.match(/\b(10\.\d{4,9}\/[^\s"<>,;]+[^\s"<>,;.)])/)||[])[1])||"";
    // ② 免费查基本信息
    const q=ax?"arxiv="+encodeURIComponent(ax):doi?"doi="+encodeURIComponent(doi):(!isPlaceholderTitle(p)?"title="+encodeURIComponent(p.title):"");
    if(q){const m=await (await fetch("/api/meta?"+q)).json();
      if(m.ok){if(m.title&&(isPlaceholderTitle(p)||opt.force))patch.title=m.title;
        for(const k of ["authors","date","venue","doi","abstract","link"])if(m[k]&&empty(k))patch[k]=m[k];
        if(m.arxiv&&!p.arxiv)patch.arxiv=m.arxiv}}
    if(ax&&!p.arxiv)patch.arxiv=ax;if(doi&&!p.doi&&!patch.doi)patch.doi=doi;
    if(Object.keys(patch).length){await upd("papers/"+id,patch);p=Object.assign(p,patch)}
    // ③ AI 读论文，填写需要理解的内容
    const need=["contribution","threat","relevance","advice"].filter(empty);const dirs=Object.keys(DIRS).filter(d=>d!=="其他");
    const wantDir=(!p.direction||p.direction==="其他")&&dirs.length;
    if(CFG&&CFG.hasKey&&S.sample&&(need.length||wantDir||isPlaceholderTitle(p))){st.msg="AI 正在读论文、填写贡献和问题设定…";render();
      const {text,src}=await paperFullText(p,24000);const body=(text&&text.length>200)?text:[p.title,p.abstract].filter(Boolean).join("\n");
      if(body&&body.length>80){
        const prompt="你是严谨的科研助理。根据下面的论文内容，填写这篇论文的卡片信息。"+FOCUS_LINE()+"只依据论文内容，不要编造；用中文，术语保留英文；公式用 $...$。\n只输出 JSON：{"+
          (isPlaceholderTitle(p)?'"title":"论文的英文原标题","authors":"作者，逗号分开","year":"年份",':"")+
          '"contribution":"核心贡献：两三句说清做了什么、效果如何（带关键数字）","threat":"问题设定：研究对象、前提假设、输入输出，一两句",'+
          '"relevance":"'+(myFocus()?"和用户研究方向的关联、可借鉴之处，一两句":"这篇论文适合谁读、能借鉴什么，一句话")+'","advice":"精读 / 略读 / 跳过 三选一，后面加一句理由"'+
          (wantDir?',"direction":"从这几个分类里选最合适的一个，都不合适就填空字符串：'+dirs.join("、")+'"':"")+"}\n\n论文内容（"+src+"）：\n"+body;
        const d=await aiJSON(prompt,t=>{st.msg="AI 正在填写…（已写 "+t.length+" 字）";const el=document.getElementById("autof-msg");if(el)el.textContent=st.msg},1500);
        const fresh=await get()||p;const ap={};
        for(const k of ["contribution","threat","relevance","advice"])if(d[k]&&(!String(fresh[k]||"").trim()||opt.force))ap[k]=String(d[k]);
        if(wantDir&&d.direction&&dirs.includes(d.direction)&&(!fresh.direction||fresh.direction==="其他"))ap.direction=d.direction;
        if(isPlaceholderTitle(fresh)&&d.title)ap.title=d.title;if(!fresh.authors&&d.authors)ap.authors=d.authors;if(!fresh.date&&d.year)ap.date=String(d.year);
        if(Object.keys(ap).length)await upd("papers/"+id,ap);

        if(ap.title&&!fresh.doi&&!fresh.arxiv){try{const m=await (await fetch("/api/meta?title="+encodeURIComponent(ap.title))).json();
          if(m.ok){const mp={};for(const k of ["venue","doi","arxiv","link","abstract"])if(m[k]&&!fresh[k])mp[k]=m[k];if(m.date&&(!fresh.date||/^\d{4}$/.test(fresh.date)))mp.date=m.date;if(Object.keys(mp).length)await upd("papers/"+id,mp)}}catch(e){}}}}

  render()}
